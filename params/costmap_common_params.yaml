# Robot footprint polygon (base_link = wheel axis centre)
# front=0.473m, rear=0.100m, half_width=0.212m (adjust to match your robot)
footprint: [[ 0.473,  0.212], [ 0.473, -0.212], [-0.100, -0.212], [-0.100,  0.212]]

global_frame: map
robot_base_frame: base_link

plugins:
- name: static_layer
  type: costmap_2d::StaticLayer
- name: obstacle_layer
  type: costmap_2d::ObstacleLayer
- name: inflation_layer
  type: costmap_2d::InflationLayer

static_layer:
  map_topic: mower_map_service/map
obstacle_layer:
  max_obstacle_height: 1.0
  obstacle_range: 3.0
  raytrace_range: 4.0
