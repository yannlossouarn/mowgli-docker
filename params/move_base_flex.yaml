planners:
  - name: GlobalPlanner
    type: global_planner/GlobalPlanner
  - name: HybridAStarPlanner
    type: hybrid_astar_planner/HybridAstarPlanner

# Hybrid A* (TransitionPlanner) tuning. step_size is kept ~= 0.5*R so the
# per-primitive turn angle stays ~29 deg (step_size / R rad).
HybridAStarPlanner:
  min_turning_radius: 0.24
  step_size: 0.12
  weight_costmap: 8.0

controllers:
  - name: FTCPlanner
    type: ftc_local_planner/FTCPlanner
  - name: DockingFTCPlanner
    type: ftc_local_planner/FTCPlanner

controller_frequency: 20.0
controller_patience: 60.0

planner_frequency: 1.0
planner_patience: 30.0

oscillation_timeout: 10.0
oscillation_distance: 0.2
