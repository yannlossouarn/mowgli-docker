# Mowgli drives its ESCs directly via the Mowgli mainboard over USB.
# OM_NO_COMMS=True disables mower_comms_v1, so these values are unused.
left_xesc:
  xesc_type: "xesc_mini"
  serial_port: "/dev/null"
  motor_pole_pairs: 4
  has_motor_temp: false
right_xesc:
  xesc_type: "xesc_mini"
  serial_port: "/dev/null"
  motor_pole_pairs: 4
  has_motor_temp: false
mower_xesc:
  xesc_type: "xesc_mini"
  serial_port: "/dev/null"
  motor_pole_pairs: 4
  has_motor_temp: true
  min_motor_rpm_critical: 2300
  min_motor_rpm: 2800
  max_motor_rpm: 3800
